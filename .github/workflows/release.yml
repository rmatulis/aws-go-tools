name: Build and Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

# Read-only by default; the two jobs that tag and publish ask for write access.
permissions:
  contents: read

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Only run on merged PRs or manual dispatch
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
      changelog: ${{ steps.bump.outputs.changelog }}
      bump_type: ${{ steps.determine_bump.outputs.bump_type }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Determine version bump from PR labels
        id: determine_bump
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          BUMP_TYPE="patch"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "PR Labels: $LABELS"
            if [[ "$LABELS" == *"major"* ]] || [[ "$LABELS" == *"breaking"* ]]; then
              BUMP_TYPE="major"
            elif [[ "$LABELS" == *"minor"* ]] || [[ "$LABELS" == *"feature"* ]]; then
              BUMP_TYPE="minor"
            fi
          fi
          echo "bump_type=$BUMP_TYPE" >> "$GITHUB_OUTPUT"
          echo "Version bump type: $BUMP_TYPE"

      - name: Bump version and push tag
        id: bump
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # 1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: ${{ steps.determine_bump.outputs.bump_type }}
          INITIAL_VERSION: 0.1.0
          RELEASE_BRANCHES: main
          PRERELEASE: false

  build-and-release:
    needs: bump-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: aws-go-tools-linux-amd64
          - goos: linux
            goarch: arm64
            output: aws-go-tools-linux-arm64
          - goos: darwin
            goarch: amd64
            output: aws-go-tools-darwin-amd64
          - goos: darwin
            goarch: arm64
            output: aws-go-tools-darwin-arm64
          - goos: windows
            goarch: amd64
            output: aws-go-tools-windows-amd64.exe
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -X 'main.Version=${{ needs.bump-version.outputs.new_tag }}'" -o ${{ matrix.output }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

  create-release:
    needs: [bump-version, build-and-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ./binaries

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.bump-version.outputs.new_tag }}
          name: Release ${{ needs.bump-version.outputs.new_tag }}
          body: |
            ## What's Changed
            ${{ needs.bump-version.outputs.changelog }}

            ## Installation

            Download the appropriate binary for your platform:
            - Linux AMD64: `aws-go-tools-linux-amd64`
            - Linux ARM64: `aws-go-tools-linux-arm64`
            - macOS AMD64 (Intel): `aws-go-tools-darwin-amd64`
            - macOS ARM64 (Apple Silicon): `aws-go-tools-darwin-arm64`
            - Windows AMD64: `aws-go-tools-windows-amd64.exe`

            Make the binary executable (Linux/macOS):
            ```bash
            chmod +x aws-go-tools-*
            ```

            ## Features
            - ✅ Connect to EC2 instances via AWS SSM with configurable shells
            - ✅ Generate RDS IAM authentication tokens
            - ✅ Interactive instance selection with searchable interface
            - ✅ AWS profile and region support
            - ✅ Configurable shell support for Linux and Windows instances
            - ✅ Modern CLI built with Cobra framework
          files: |
            binaries/*/aws-go-tools-*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
